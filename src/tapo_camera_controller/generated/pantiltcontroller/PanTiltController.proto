syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.riken.instruments.pantiltcontroller.v2;

/* Pan/tilt movement and position presets of the camera (via ONVIF PTZ). Coordinate system (angles in degrees): Origin (Pan 0, Tilt 0): the direction the camera faces after power-up, i.e. the side of the camera body with the logo. MoveHome returns to it. Pan : positive = turn to the LEFT as seen from behind the camera (counter-clockwise viewed from above, for a camera standing on a table). Negative = turn to the right. Example: to turn 90 degrees to the left, use MoveRelative with DeltaPan = +90. Tilt: positive = UP, negative = DOWN. Movement range: see the MovementRange property. On a Tapo C232 it is Pan -170 to +170 (340 degrees mechanical range) and Tilt -34.5 to +34.5 (69 degrees). A target outside the movement range is not an error: the camera stops at the limit. Check the returned position. Accuracy: the camera works in a unitless -1 to +1 space; this server converts linearly using the mechanical range of the model (server options --pan-range-deg / --tilt-range-deg, Tapo C232 values by default). On a Tapo C232 this was only roughly confirmed by eye (Pan -85 to +85 looked like about 170 to 180 degrees). Treat angles as approximate, to within several degrees. Positions are reported rounded to 0.1 degree. The product page also states "360 degrees pan / 110 degrees tilt"; those are the visible coverage including the lens field of view, not the movement range. For a ceiling-mounted camera the directions may be inverted (not verified). Movement behavior (Tapo C232): The camera moves pan first, then tilt. Pan speed is about 32 degrees per second; a full pan sweep (340 degrees) takes about 11 seconds, plus up to about 5 seconds of tilt. Movement commands finish only when the camera has stopped, and return the final position. Only one movement can run at a time; a movement command issued while another is running is rejected with MovementInProgress. Snapshots and recordings may run during movements. Presets: at most 8 presets can be stored in the camera (Tapo C232). Presets are identified by a token assigned by the camera and have a name chosen by the user. Preset names are unique on this server: saving with an existing name updates that preset. */
service PanTiltController {
  /* 
      Move to an absolute pan/tilt position (degrees from the power-up front) and wait until the
      camera has stopped. A target outside MovementRange stops at the limit.
     */
  rpc MoveAbsolute (sila2.org.riken.instruments.pantiltcontroller.v2.MoveAbsolute_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveAbsolute */
  rpc MoveAbsolute_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveAbsolute */
  rpc MoveAbsolute_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.pantiltcontroller.v2.MoveAbsolute_Responses) {}
  /* 
      Turn by the given angles from the current position and wait until the camera has stopped.
      A target outside MovementRange stops at the limit (no error); check the returned position.
     */
  rpc MoveRelative (sila2.org.riken.instruments.pantiltcontroller.v2.MoveRelative_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveRelative */
  rpc MoveRelative_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveRelative */
  rpc MoveRelative_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.pantiltcontroller.v2.MoveRelative_Responses) {}
  /* Move to Pan 0, Tilt 0 (the power-up front direction) and wait until the camera has stopped. */
  rpc MoveHome (sila2.org.riken.instruments.pantiltcontroller.v2.MoveHome_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveHome */
  rpc MoveHome_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveHome */
  rpc MoveHome_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.pantiltcontroller.v2.MoveHome_Responses) {}
  /* List the presets stored in the camera. */
  rpc GetPresets (sila2.org.riken.instruments.pantiltcontroller.v2.GetPresets_Parameters) returns (sila2.org.riken.instruments.pantiltcontroller.v2.GetPresets_Responses) {}
  /* Move to a stored preset and wait until the camera has stopped. */
  rpc GotoPreset (sila2.org.riken.instruments.pantiltcontroller.v2.GotoPreset_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of GotoPreset */
  rpc GotoPreset_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of GotoPreset */
  rpc GotoPreset_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.pantiltcontroller.v2.GotoPreset_Responses) {}
  /* Store the current position as a preset with the given name. If a preset with the same name already exists, its position is updated and its token is kept. */
  rpc SavePreset (sila2.org.riken.instruments.pantiltcontroller.v2.SavePreset_Parameters) returns (sila2.org.riken.instruments.pantiltcontroller.v2.SavePreset_Responses) {}
  /* Delete a stored preset. */
  rpc RemovePreset (sila2.org.riken.instruments.pantiltcontroller.v2.RemovePreset_Parameters) returns (sila2.org.riken.instruments.pantiltcontroller.v2.RemovePreset_Responses) {}
  /* Current pan/tilt position in degrees as reported by the camera (may change while moving). */
  rpc Get_CurrentPosition (sila2.org.riken.instruments.pantiltcontroller.v2.Get_CurrentPosition_Parameters) returns (sila2.org.riken.instruments.pantiltcontroller.v2.Get_CurrentPosition_Responses) {}
  /* 
      The pan and tilt limits in degrees. They come from the server configuration
      (--pan-range-deg / --tilt-range-deg; Tapo C232 values by default), not from the camera.
     */
  rpc Get_MovementRange (sila2.org.riken.instruments.pantiltcontroller.v2.Get_MovementRange_Parameters) returns (sila2.org.riken.instruments.pantiltcontroller.v2.Get_MovementRange_Responses) {}
}

/* Pan in degrees from the power-up front, positive = left. The usable range is MovementRange. */
message DataType_PanAngle {
  sila2.org.silastandard.Real PanAngle = 1;  /* Pan in degrees from the power-up front, positive = left. The usable range is MovementRange. */
}

/* Tilt in degrees from the power-up tilt, positive = up. The usable range is MovementRange. */
message DataType_TiltAngle {
  sila2.org.silastandard.Real TiltAngle = 1;  /* Tilt in degrees from the power-up tilt, positive = up. The usable range is MovementRange. */
}

/* Pan change in degrees, positive = left. */
message DataType_PanOffset {
  sila2.org.silastandard.Real PanOffset = 1;  /* Pan change in degrees, positive = left. */
}

/* Tilt change in degrees, positive = up. */
message DataType_TiltOffset {
  sila2.org.silastandard.Real TiltOffset = 1;  /* Tilt change in degrees, positive = up. */
}

/* A pan/tilt position in degrees from the power-up front (see the feature description). */
message DataType_PanTiltPosition {
  message PanTiltPosition_Struct {
    sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanAngle Pan = 1;  /* Pan in degrees. Positive = left of the power-up front. */
    sila2.org.riken.instruments.pantiltcontroller.v2.DataType_TiltAngle Tilt = 2;  /* Tilt in degrees. Positive = up. */
  }
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanTiltPosition.PanTiltPosition_Struct PanTiltPosition = 1;  /* A pan/tilt position in degrees from the power-up front (see the feature description). */
}

/* Pan and tilt limits in degrees. */
message DataType_MovementRange {
  message MovementRange_Struct {
    sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanAngle PanMin = 1;  /* Rightmost pan (negative). */
    sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanAngle PanMax = 2;  /* Leftmost pan (positive). */
    sila2.org.riken.instruments.pantiltcontroller.v2.DataType_TiltAngle TiltMin = 3;  /* Lowest tilt (negative). */
    sila2.org.riken.instruments.pantiltcontroller.v2.DataType_TiltAngle TiltMax = 4;  /* Highest tilt (positive). */
  }
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_MovementRange.MovementRange_Struct MovementRange = 1;  /* Pan and tilt limits in degrees. */
}

/* A stored pan/tilt preset. */
message DataType_Preset {
  message Preset_Struct {
    sila2.org.silastandard.String PresetToken = 1;  /* Identifier assigned by the camera; use it with GotoPreset and RemovePreset. */
    sila2.org.silastandard.String Name = 2;  /* User-defined name. */
  }
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_Preset.Preset_Struct Preset = 1;  /* A stored pan/tilt preset. */
}

/* Parameters for MoveAbsolute */
message MoveAbsolute_Parameters {
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanAngle Pan = 1;  /* Target pan in degrees. Positive = left, negative = right; 0 = power-up front. */
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_TiltAngle Tilt = 2;  /* Target tilt in degrees. Positive = up, negative = down; 0 = power-up tilt. */
}

/* Responses of MoveAbsolute */
message MoveAbsolute_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanTiltPosition Position = 1;  /* Position after the movement. */
}

/* Parameters for MoveRelative */
message MoveRelative_Parameters {
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanOffset DeltaPan = 1;  /* Pan change in degrees. Positive = left, negative = right. */
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_TiltOffset DeltaTilt = 2;  /* Tilt change in degrees. Positive = up, negative = down. */
}

/* Responses of MoveRelative */
message MoveRelative_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanTiltPosition Position = 1;  /* Position after the movement. */
}

/* Parameters for MoveHome */
message MoveHome_Parameters {
}

/* Responses of MoveHome */
message MoveHome_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanTiltPosition Position = 1;  /* Position after the movement. */
}

/* Parameters for GetPresets */
message GetPresets_Parameters {
}

/* Responses of GetPresets */
message GetPresets_Responses {
  repeated sila2.org.riken.instruments.pantiltcontroller.v2.DataType_Preset Presets = 1;  /* Stored presets. */
}

/* Parameters for GotoPreset */
message GotoPreset_Parameters {
  sila2.org.silastandard.String PresetToken = 1;  /* Token of the preset (see GetPresets). */
}

/* Responses of GotoPreset */
message GotoPreset_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanTiltPosition Position = 1;  /* Position after the movement. */
}

/* Parameters for SavePreset */
message SavePreset_Parameters {
  sila2.org.silastandard.String Name = 1;  /* Preset name: 1 to 32 bytes in UTF-8 (e.g. up to 32 ASCII characters or about 10 Japanese characters). The characters & < > " ' are not allowed (the camera cannot handle them). */
}

/* Responses of SavePreset */
message SavePreset_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_Preset Preset = 1;  /* The saved preset. */
}

/* Parameters for RemovePreset */
message RemovePreset_Parameters {
  sila2.org.silastandard.String PresetToken = 1;  /* Token of the preset (see GetPresets). */
}

/* Responses of RemovePreset */
message RemovePreset_Responses {
}

/* Parameters for CurrentPosition */
message Get_CurrentPosition_Parameters {
}

/* Responses of CurrentPosition */
message Get_CurrentPosition_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_PanTiltPosition CurrentPosition = 1;  /* Current pan/tilt position in degrees as reported by the camera (may change while moving). */
}

/* Parameters for MovementRange */
message Get_MovementRange_Parameters {
}

/* Responses of MovementRange */
message Get_MovementRange_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v2.DataType_MovementRange MovementRange = 1;  /* The pan and tilt limits in degrees. They come from the server configuration (--pan-range-deg / --tilt-range-deg; Tapo C232 values by default), not from the camera. */
}
