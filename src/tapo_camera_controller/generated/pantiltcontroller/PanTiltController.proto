syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.riken.instruments.pantiltcontroller.v1;

/* Pan/tilt movement and position presets of the camera (via ONVIF PTZ). Coordinate system (normalized ONVIF generic space, unitless, range -1.0 to +1.0 on both axes): Origin (Pan 0, Tilt 0): the direction the camera faces after power-up, i.e. the side of the camera body with the logo. MoveHome returns to it. Pan : positive = turn to the LEFT as seen from behind the camera (counter-clockwise viewed from above, for a camera standing on a table). Negative = turn to the right. -1.0 to +1.0 spans the mechanical pan range of 340 degrees (Tapo C232), i.e. about 170 degrees per 1.0: Pan +1.0 is about 170 degrees left, -1.0 about 170 degrees right. Example: to turn about 90 degrees to the left, use MoveRelative with DeltaPan = +0.53. Tilt: positive = UP, negative = DOWN. -1.0 to +1.0 spans the mechanical tilt range of 69 degrees (Tapo C232), i.e. about 35 degrees per 1.0. Note: the product page also states "360 degrees pan / 110 degrees tilt"; those are the visible coverage including the lens field of view, not the movement range. The degree values assume a linear mapping derived from the specification and were only roughly confirmed by eye on a Tapo C232 (pan: Pan -0.5 to +0.5 looked like about 170 to 180 degrees). Treat them as approximations. For a ceiling-mounted camera the directions may be inverted (not verified). Other camera models may have different mechanical ranges. Movement behavior (Tapo C232): The camera moves pan first, then tilt. Pan speed is about 0.19 per second (about 32 degrees per second); a full pan sweep from -1.0 to +1.0 takes about 11 seconds, plus up to about 5 seconds of tilt. Movement commands finish only when the camera has stopped, and return the final position. Only one movement can run at a time; a movement command issued while another is running is rejected with MovementInProgress. Snapshots and recordings may run during movements. Presets: at most 8 presets can be stored in the camera (Tapo C232). Presets are identified by a token assigned by the camera and have a name chosen by the user. Preset names are unique on this server: saving with an existing name updates that preset. */
service PanTiltController {
  /* 
      Move to an absolute pan/tilt position and wait until the camera has stopped.
      See the feature description for the meaning of the coordinates.
     */
  rpc MoveAbsolute (sila2.org.riken.instruments.pantiltcontroller.v1.MoveAbsolute_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveAbsolute */
  rpc MoveAbsolute_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveAbsolute */
  rpc MoveAbsolute_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.pantiltcontroller.v1.MoveAbsolute_Responses) {}
  /* 
      Move by the given offsets from the current position and wait until the camera has stopped.
      If the target lies outside -1.0 to +1.0, the camera stops at the limit (no error);
      check the returned position.
     */
  rpc MoveRelative (sila2.org.riken.instruments.pantiltcontroller.v1.MoveRelative_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveRelative */
  rpc MoveRelative_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveRelative */
  rpc MoveRelative_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.pantiltcontroller.v1.MoveRelative_Responses) {}
  /* Move to Pan 0, Tilt 0 (the power-up front direction) and wait until the camera has stopped. */
  rpc MoveHome (sila2.org.riken.instruments.pantiltcontroller.v1.MoveHome_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveHome */
  rpc MoveHome_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveHome */
  rpc MoveHome_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.pantiltcontroller.v1.MoveHome_Responses) {}
  /* List the presets stored in the camera. */
  rpc GetPresets (sila2.org.riken.instruments.pantiltcontroller.v1.GetPresets_Parameters) returns (sila2.org.riken.instruments.pantiltcontroller.v1.GetPresets_Responses) {}
  /* Move to a stored preset and wait until the camera has stopped. */
  rpc GotoPreset (sila2.org.riken.instruments.pantiltcontroller.v1.GotoPreset_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of GotoPreset */
  rpc GotoPreset_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of GotoPreset */
  rpc GotoPreset_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.pantiltcontroller.v1.GotoPreset_Responses) {}
  /* Store the current position as a preset with the given name. If a preset with the same name already exists, its position is updated and its token is kept. */
  rpc SavePreset (sila2.org.riken.instruments.pantiltcontroller.v1.SavePreset_Parameters) returns (sila2.org.riken.instruments.pantiltcontroller.v1.SavePreset_Responses) {}
  /* Delete a stored preset. */
  rpc RemovePreset (sila2.org.riken.instruments.pantiltcontroller.v1.RemovePreset_Parameters) returns (sila2.org.riken.instruments.pantiltcontroller.v1.RemovePreset_Responses) {}
  /* Current pan/tilt position as reported by the camera (may change while moving). */
  rpc Get_CurrentPosition (sila2.org.riken.instruments.pantiltcontroller.v1.Get_CurrentPosition_Parameters) returns (sila2.org.riken.instruments.pantiltcontroller.v1.Get_CurrentPosition_Responses) {}
}

/* Normalized pan or tilt position, -1.0 to +1.0 (see the feature description). */
message DataType_NormalizedCoordinate {
  sila2.org.silastandard.Real NormalizedCoordinate = 1;  /* Normalized pan or tilt position, -1.0 to +1.0 (see the feature description). */
}

/* Normalized pan or tilt offset, -2.0 to +2.0 (see the feature description). */
message DataType_NormalizedOffset {
  sila2.org.silastandard.Real NormalizedOffset = 1;  /* Normalized pan or tilt offset, -2.0 to +2.0 (see the feature description). */
}

/* A pan/tilt position in normalized coordinates (see the feature description). */
message DataType_PanTiltPosition {
  message PanTiltPosition_Struct {
    sila2.org.silastandard.Real Pan = 1;  /* Pan, -1.0 to +1.0. Positive = left of the power-up front, about 170 degrees per 1.0. */
    sila2.org.silastandard.Real Tilt = 2;  /* Tilt, -1.0 to +1.0. Positive = up, about 35 degrees per 1.0. */
  }
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_PanTiltPosition.PanTiltPosition_Struct PanTiltPosition = 1;  /* A pan/tilt position in normalized coordinates (see the feature description). */
}

/* A stored pan/tilt preset. */
message DataType_Preset {
  message Preset_Struct {
    sila2.org.silastandard.String PresetToken = 1;  /* Identifier assigned by the camera; use it with GotoPreset and RemovePreset. */
    sila2.org.silastandard.String Name = 2;  /* User-defined name. */
  }
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_Preset.Preset_Struct Preset = 1;  /* A stored pan/tilt preset. */
}

/* Parameters for MoveAbsolute */
message MoveAbsolute_Parameters {
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_NormalizedCoordinate Pan = 1;  /* Target pan, -1.0 (about 170 degrees right) to +1.0 (about 170 degrees left); 0 = power-up front. */
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_NormalizedCoordinate Tilt = 2;  /* Target tilt, -1.0 (lowest) to +1.0 (highest); 0 = power-up tilt. About 35 degrees per 1.0. */
}

/* Responses of MoveAbsolute */
message MoveAbsolute_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_PanTiltPosition Position = 1;  /* Position after the movement. */
}

/* Parameters for MoveRelative */
message MoveRelative_Parameters {
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_NormalizedOffset DeltaPan = 1;  /* Pan offset, -2.0 to +2.0. Positive = left. About 170 degrees per 1.0. */
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_NormalizedOffset DeltaTilt = 2;  /* Tilt offset, -2.0 to +2.0. Positive = up. About 35 degrees per 1.0. */
}

/* Responses of MoveRelative */
message MoveRelative_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_PanTiltPosition Position = 1;  /* Position after the movement. */
}

/* Parameters for MoveHome */
message MoveHome_Parameters {
}

/* Responses of MoveHome */
message MoveHome_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_PanTiltPosition Position = 1;  /* Position after the movement. */
}

/* Parameters for GetPresets */
message GetPresets_Parameters {
}

/* Responses of GetPresets */
message GetPresets_Responses {
  repeated sila2.org.riken.instruments.pantiltcontroller.v1.DataType_Preset Presets = 1;  /* Stored presets. */
}

/* Parameters for GotoPreset */
message GotoPreset_Parameters {
  sila2.org.silastandard.String PresetToken = 1;  /* Token of the preset (see GetPresets). */
}

/* Responses of GotoPreset */
message GotoPreset_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_PanTiltPosition Position = 1;  /* Position after the movement. */
}

/* Parameters for SavePreset */
message SavePreset_Parameters {
  sila2.org.silastandard.String Name = 1;  /* Preset name: 1 to 32 bytes in UTF-8 (e.g. up to 32 ASCII characters or about 10 Japanese characters). The characters & < > " ' are not allowed (the camera cannot handle them). */
}

/* Responses of SavePreset */
message SavePreset_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_Preset Preset = 1;  /* The saved preset. */
}

/* Parameters for RemovePreset */
message RemovePreset_Parameters {
  sila2.org.silastandard.String PresetToken = 1;  /* Token of the preset (see GetPresets). */
}

/* Responses of RemovePreset */
message RemovePreset_Responses {
}

/* Parameters for CurrentPosition */
message Get_CurrentPosition_Parameters {
}

/* Responses of CurrentPosition */
message Get_CurrentPosition_Responses {
  sila2.org.riken.instruments.pantiltcontroller.v1.DataType_PanTiltPosition CurrentPosition = 1;  /* Current pan/tilt position as reported by the camera (may change while moving). */
}
